---
layout: default
---
<article class="article">
  <div class="eyebrow">{{ page.date | date: "%Y-%m-%d" }} · writeup</div>
  <h1>{{ page.title }}</h1>
  <p>{{ page.description }}</p>
  <div class="tags">{% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}</div>
  {{ content }}
</article>
